<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>$$K.1</title>
    <style>
      :root {
        --bg: #0a0511;
        --card: #150c24;
        --line: #2b1c47;
        --violet: #a855f7;
        --violet-dim: #7c3aed;
        --text: #f5f0ff;
        --muted: #9a8bb8;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
        background:
          radial-gradient(900px 500px at 50% -10%, #2a1148 0%, transparent 70%),
          var(--bg);
        color: var(--text);
        font: 400 16px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .card {
        width: min(420px, 100%);
        padding: 36px 32px 28px;
        border: 1px solid var(--line);
        border-radius: 22px;
        background: linear-gradient(180deg, var(--card), #100819);
        box-shadow:
          0 0 0 1px rgba(168, 85, 247, 0.06),
          0 40px 80px -30px rgba(124, 58, 237, 0.45);
        text-align: center;
      }

      .logo {
        width: 104px;
        height: 104px;
        border-radius: 50%;
        margin: 0 auto 22px;
        display: block;
        filter: drop-shadow(0 0 28px rgba(168, 85, 247, 0.55));
      }

      .ticker {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--violet);
      }

      .value {
        margin: 14px 0 4px;
        font-size: 52px;
        font-weight: 700;
        letter-spacing: -0.03em;
        font-variant-numeric: tabular-nums;
      }

      .amount {
        font-size: 17px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      .facts {
        margin-top: 26px;
        border-top: 1px solid var(--line);
        display: grid;
        gap: 1px;
      }

      .fact {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        padding: 11px 2px;
        font-size: 14px;
        border-bottom: 1px solid rgba(43, 28, 71, 0.55);
      }

      .fact:last-child {
        border-bottom: 0;
      }

      .fact dt {
        color: var(--muted);
      }

      .fact dd {
        font-variant-numeric: tabular-nums;
      }

      .ok {
        color: #4ade80;
      }

      .addr {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12.5px;
      }

      a {
        color: inherit;
        text-decoration: none;
        border-bottom: 1px solid rgba(168, 85, 247, 0.4);
      }

      a:hover {
        border-bottom-color: var(--violet);
      }

      .note {
        margin-top: 20px;
        font-size: 11.5px;
        line-height: 1.45;
        color: #6f6091;
        text-align: left;
      }
    </style>
  </head>

  <body>
    <main class="card">
      <img class="logo" src="../assets/logo-256.png" alt="$$K.1" />

      <p class="ticker">$$K.1</p>
      <p class="value" id="value">$1 000,00</p>
      <p class="amount" id="amount">1 000 000 $$K.1</p>

      <dl class="facts">
        <div class="fact"><dt>Сеть</dt><dd>Base</dd></div>
        <div class="fact"><dt>Исходники</dt><dd class="ok">верифицированы</dd></div>
        <div class="fact"><dt>Эмиссия</dt><dd>фиксированная, mint отсутствует</dd></div>
        <div class="fact">
          <dt>Контракт</dt>
          <dd>
            <a
              class="addr"
              href="https://basescan.org/token/0x72883511A0B1dE1fF1cA0669D0C3dE699D56c0a8"
              >0x7288…c0a8</a
            >
          </dd>
        </div>
      </dl>

      <p class="note">
        Сумма посчитана по заявленной цене $0,001 за токен. Рыночной цены у токена нет:
        пула ликвидности не существует, продать его не за что. Цифра — оформление, а не оценка.
      </p>
    </main>

    <script type="module">
      // Живой баланс из сети. Если RPC недоступен, на странице остаются значения из разметки.
      const CONTRACT = '0x72883511A0B1dE1fF1cA0669D0C3dE699D56c0a8'
      const HOLDER = '0x0cf1430E31B264a262aFF5fBA4D577daB5660A2a'
      const DECLARED_PRICE = 0.001

      const ru = (value, digits = 0) =>
        value.toLocaleString('ru-RU', { minimumFractionDigits: digits, maximumFractionDigits: digits })

      try {
        const response = await fetch('https://mainnet.base.org', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            jsonrpc: '2.0',
            id: 1,
            method: 'eth_call',
            params: [{ to: CONTRACT, data: `0x70a08231${HOLDER.slice(2).toLowerCase().padStart(64, '0')}` }, 'latest'],
          }),
        })

        const { result } = await response.json()
        if (!result || result === '0x') throw new Error('пустой ответ')

        const tokens = Number(BigInt(result) / 10n ** 16n) / 100
        document.getElementById('amount').textContent = `${ru(tokens)} $$K.1`
        document.getElementById('value').textContent = `$${ru(tokens * DECLARED_PRICE, 2)}`
      } catch {
        // Оставляем статичные значения — страница остаётся читаемой без сети.
      }
    </script>
  </body>
</html>
